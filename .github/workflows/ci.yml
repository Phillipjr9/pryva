name: CI

# Every gate that already existed, run on every change instead of by hand.
#
# No secrets are required: provider calls are mocked, PostgreSQL runs in-process
# through PGlite, and the production build reads no required environment
# variable. A pipeline that only passes where credentials happen to exist would
# prove nothing about a fork or a fresh clone.

on:
  pull_request:
  push:
    branches: [main]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  checks:
    # Pinned: ubuntu-latest migrates to Ubuntu 26 during Oct 2026, and the
    # runner image should not change under a gate that is meant to be boring.
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - run: npm ci --no-audit --no-fund

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      # Fails when a generated price has drifted outside the 30-50% band. The
      # `--check` flag is the whole point: without it the command reports the
      # violation and still exits 0.
      - name: Generated prices are inside the profit band
        run: npm run pricing:audit -- --check

      - name: Tests
        run: npm test

      - name: Production build
        run: npm run build
